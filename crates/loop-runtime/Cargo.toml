[package]
name = "loop-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime ownership and durable Session Event Log"

[features]
orchestration = ["loop-agent/orchestration"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
loop-agent = { workspace = true, features = ["sqlite"] }
loop-ai.workspace = true
loop-app-core.workspace = true
loop-protocol.workspace = true
loop-wire.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
anyhow.workspace = true
loop-orchestration.workspace = true
loop-store-testkit = { path = "../core/loop-store-testkit", default-features = false, features = ["event-log"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio-util.workspace = true
