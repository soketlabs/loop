[package]
name = "loop-store-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared conformance suites for Loop stores (Event Log and Session store), usable by stores outside this repository"
publish = false

[features]
default = ["event-log", "session-store"]
# Event Log suite. Needs the `EventLog` contract from loop-store.
event-log = ["dep:loop-store", "dep:loop-protocol", "dep:serde_json"]
# Session store suite. Needs the `SessionStore` trait from loop-agent.
session-store = ["dep:loop-agent", "dep:serde_json"]

[dependencies]
loop-agent = { workspace = true, optional = true }
loop-protocol = { workspace = true, optional = true }
loop-store = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
