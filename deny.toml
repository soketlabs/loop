# Security gates cover the full workspace, including optional desktop dependencies.
[advisories]
yanked = "warn"
unmaintained = "all"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/modelcontextprotocol/rust-sdk",
    "https://github.com/longbridge/gpui-component",
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/reqwest",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs",
]

# License findings are informational until the project's license policy is settled.
[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0"]
