[workspace]
resolver = "2"
members = [
    "crates/loop-ai",
    "crates/loop-orchestration",
    "crates/loop-mcp",
    "crates/loop-agent",
    "crates/loop-app-core",
    "crates/loop-cli",
    "crates/loop-desktop",
]

[workspace.package]
version = "v0.3.1-ir-30080301"
edition = "2021"
license = "MIT"
repository = "https://github.com/soket/loop"
rust-version = "1.85"

[workspace.dependencies]
loop-ai = { path = "crates/loop-ai" }
loop-agent = { path = "crates/loop-agent" }
loop-app-core = { path = "crates/loop-app-core" }
loop-orchestration = { path = "crates/loop-orchestration" }
loop-mcp = { path = "crates/loop-mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "signal", "net"] }
tokio-util = { version = "0.7", default-features = true }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
bytes = "1"
jsonschema = { version = "0.29", default-features = false }
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
similar = "2"
ignore = "0.4"
tempfile = "3"
regex = "1"
base64 = "0.22"
mime_guess = "2"
walkdir = "2"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
arboard = "3"
rhai = { version = "1.21", default-features = false, features = ["std", "sync"] }
rustyline = "15"
unicode-width = "0.2"
tokio-stream = { version = "0.1", features = ["sync"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", branch = "main", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
axum = "0.8"
tower = "0.5"

# GPUI desktop
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component-assets" }
async-channel = "2"
portable-pty = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
