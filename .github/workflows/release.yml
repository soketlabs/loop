name: Release

# Builds multi-platform binaries and publishes a GitHub Release.
# Does NOT run on every push to main — only when you cut a version tag
# (or manually via workflow_dispatch).
#
# Tag release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Manual dry-run (artifacts only, no GitHub Release):
#   Actions → Release → Run workflow → leave "create_release" unchecked
#
# macOS Gatekeeper:
#   macOS binaries are code-signed and notarized so they pass Gatekeeper
#   without quarantine warnings. This requires these repository secrets:
#
#     APPLE_CERTIFICATE_BASE64   - Developer ID Application cert (.p12), base64-encoded
#     APPLE_CERTIFICATE_PASSWORD - Password for the .p12
#     APPLE_TEAM_ID              - Apple Developer Team ID (e.g. "A1B2C3D4E5")
#     APPLE_ID                   - Apple ID email for notarytool
#     APPLE_ID_PASSWORD          - App-specific password (appleid.apple.com → Sign-In and Security → App-Specific Passwords)
#
#   If the secrets are absent the build still succeeds — binaries are just unsigned.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release (requires tag_name)"
        type: boolean
        default: false
      tag_name:
        description: "Tag to publish (e.g. v0.1.0). Required when create_release is true."
        type: string
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            sign: true
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            sign: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build -p loop-cli --release --locked --target ${{ matrix.target }}

      # ── macOS code signing & notarization ──────────────────────────
      - name: Import Apple certificate
        if: matrix.sign && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          CERT_FILE="$(mktemp)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" \
            -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          rm -f "$CERT_FILE"

          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign binary
        if: matrix.sign && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/loop"
          IDENTITY="Developer ID Application: ($APPLE_TEAM_ID)"

          # Find the actual signing identity from the keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" \
            | head -1 \
            | sed -E 's/.*"(Developer ID Application[^"]+)".*/\1/')

          if [[ -z "$IDENTITY" ]]; then
            echo "::warning::No Developer ID Application identity found; skipping signing"
            exit 0
          fi

          echo "Signing with: $IDENTITY"
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            "$bin"

          codesign --verify --verbose "$bin"
          echo "MACOS_SIGNED=true" >> "$GITHUB_ENV"

      - name: Notarize binary
        if: matrix.sign && env.MACOS_SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/loop"

          # notarytool requires a zip, dmg, or pkg
          NOTARIZE_ZIP="$(mktemp -d)/loop-notarize.zip"
          ditto -c -k --keepParent "$bin" "$NOTARIZE_ZIP"

          echo "Submitting for notarization…"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 15m

          echo "Notarization complete"

      - name: Clean up keychain
        if: matrix.sign && env.KEYCHAIN != '' && always()
        shell: bash
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
      # ── end macOS signing ──────────────────────────────────────────

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/loop"
          staging="loop-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "$bin" "$staging/loop"
          chmod +x "$staging/loop"
          tar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${staging}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "loop-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/loop.exe" "$staging/loop.exe"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          $hash = (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$staging.zip.sha256" -Value "$hash  $staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHECKSUM=$staging.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ inputs.tag_name }}"
            if [[ -z "$tag" ]]; then
              echo "tag_name is required when create_release is true" >&2
              exit 1
            fi
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "tag_name must look like v0.1.0 (got: $tag)" >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check workspace version matches tag
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          tag_version="${{ steps.tag.outputs.version }}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ($cargo_version) does not match tag version ($tag_version)." >&2
            echo "Bump [workspace.package] version in Cargo.toml before tagging." >&2
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Loop ${{ steps.tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
