name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: ShellCheck
        run: shellcheck install.sh

      - name: clippy
        run: cargo clippy --workspace --exclude loop-desktop --all-targets --locked -- -D warnings

      - name: clippy (telemetry)
        run: cargo clippy --workspace --exclude loop-desktop --all-targets --features loop-agent/telemetry,loop-app-core/telemetry,loop-cli/telemetry --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Lifecycle (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LOOP_TEST_POWERSHELL: powershell.exe
        run: cargo test -p loop-update --test lifecycle --locked

      # Telemetry code has no OS-specific parts: run its tests on Linux only,
      # and only check that it compiles on macOS and Windows.
      - name: Check (telemetry)
        if: runner.os != 'Linux'
        run: cargo check --workspace --exclude loop-desktop --all-targets --features loop-agent/telemetry,loop-app-core/telemetry,loop-cli/telemetry --locked

      - name: Build (telemetry)
        if: runner.os == 'Linux'
        run: cargo build -p loop-cli --features telemetry --locked

      - name: Test (telemetry)
        if: runner.os == 'Linux'
        run: cargo test -p loop-telemetry -p loop-agent -p loop-app-core -p loop-cli --features loop-agent/telemetry,loop-app-core/telemetry,loop-cli/telemetry --locked
