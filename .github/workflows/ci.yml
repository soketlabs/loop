name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI never runs a debugger: line tables keep file and line numbers in
  # panics but make target/ (and so the cache) much smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Only main saves caches. PRs restore main's cache, so per-PR copies
      # don't push main's out of the 10 GB repo limit.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: ShellCheck
        run: shellcheck install.sh

      - name: clippy
        run: cargo clippy --workspace --exclude loop-desktop --all-targets --locked -- -D warnings

      - name: clippy (telemetry)
        run: cargo clippy --workspace --exclude loop-desktop --all-targets --features loop-agent/telemetry,loop-app-core/telemetry,loop-cli/telemetry --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Only main saves caches. PRs restore main's cache, so per-PR copies
      # don't push main's out of the 10 GB repo limit.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Lifecycle (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LOOP_TEST_POWERSHELL: powershell.exe
        run: cargo test -p loop-update --test lifecycle --locked

      # Build with telemetry on every OS, which reuses the artifacts from the
      # Build step. Telemetry code has no OS-specific parts, so its tests
      # only run on Linux. (cargo check would be slower here: it cannot reuse
      # build artifacts and recompiles every dependency.)
      - name: Build (telemetry)
        run: cargo build -p loop-cli --features telemetry --locked

      - name: Test (telemetry)
        if: runner.os == 'Linux'
        run: cargo test -p loop-telemetry -p loop-agent -p loop-app-core -p loop-cli --features loop-agent/telemetry,loop-app-core/telemetry,loop-cli/telemetry --locked
