name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to scan for a release
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check advisories and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: '1.98.1'
          arguments: --locked --all-features
          command: check advisories sources --warn unmaintained
      - name: Report dependency licenses (informational)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: '1.98.1'
          arguments: --locked --all-features
          command: check licenses

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/security-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/security-tools" gitleaks
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Scan commits and current tree (redacted)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            gitleaks git --redact --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --redact .
          fi
          gitleaks dir --redact .

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          advanced-security: false
          min-severity: medium
          min-confidence: high

  codeql:
    name: Rust source security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:rust
          output: ${{ runner.temp }}/codeql-results
          upload: ${{ inputs.ref == '' }}
      - name: Block high and critical findings
        run: python3 .github/scripts/check-codeql.py "$RUNNER_TEMP/codeql-results"

  gate:
    name: Security gate
    if: always()
    needs: [dependencies, secrets, workflows, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every security job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Security checks did not pass: ' + ', '.join(failed))
          PY
